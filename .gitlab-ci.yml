workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'

stages:
  - quality
  - test
  - build
  - deploy
  - notify

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-local"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx2g'"

default:
  image: ghcr.io/cirruslabs/android-sdk:35
  cache:
    key: "gradle-${CI_PROJECT_ID}"
    paths:
      - .gradle/
      - .gradle-local/
  before_script:
    - chmod +x gradlew

lint_debug:
  stage: quality
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
  script:
    - ./gradlew --no-daemon :app:lintDebug
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/reports/lint-results-debug.html
      - app/build/reports/lint-results-debug.xml

unit_tests:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
  script:
    - ./gradlew --no-daemon testDebugUnitTest
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/reports/tests/testDebugUnitTest/
      - app/build/test-results/testDebugUnitTest/

build_debug_apk:
  stage: build
  needs: ["unit_tests"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
  script:
    - ./gradlew --no-daemon :app:assembleDebug
  artifacts:
    expire_in: 7 days
    paths:
      - app/build/outputs/apk/debug/app-debug.apk

build_release_aab:
  stage: build
  needs: ["unit_tests"]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev")'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
      when: manual
  script:
    - ./gradlew --no-daemon :app:bundleRelease
  artifacts:
    expire_in: 14 days
    paths:
      - app/build/outputs/bundle/release/app-release.aab

deploy_release_play_console:
  stage: deploy
  image: ruby:3.3-alpine
  needs: ["build_release_aab"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev") && $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'
    - if: '$CI_COMMIT_TAG && $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master") && $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'
      when: manual
  variables:
    PLAY_TRACK: "${PLAY_TRACK:-internal}"
    PLAY_RELEASE_STATUS: "${PLAY_RELEASE_STATUS:-draft}"
  before_script:
    - apk add --no-cache bash curl git build-base ruby-dev
    - gem install fastlane --no-document
  script:
    - |
      if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
        echo "ERRO: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON nao definida."
        exit 1
      fi

      if [ -f "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
        PLAY_JSON_PATH="${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}"
      else
        PLAY_JSON_PATH="/tmp/google-play-service-account.json"
        printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" > "${PLAY_JSON_PATH}"
      fi

      fastlane supply \
        --aab "app/build/outputs/bundle/release/app-release.aab" \
        --json_key "${PLAY_JSON_PATH}" \
        --package_name "${PLAY_PACKAGE_NAME:-br.com.gui.carlembrete}" \
        --track "${PLAY_TRACK:-internal}" \
        --release_status "${PLAY_RELEASE_STATUS:-draft}" \
        --skip_upload_images true \
        --skip_upload_screenshots true \
        --skip_upload_metadata true \
        --skip_upload_changelogs true

notify_google_chat:
  stage: notify
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev") && $GOOGLE_CHAT_WEBHOOK_URL'
  script:
    - apk add --no-cache git curl jq
    - |
      SHORT_SHA="$(printf '%s' "${CI_COMMIT_SHA}" | cut -c1-8)"
      git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*'

      if git show-ref --verify --quiet refs/remotes/origin/main; then
        MAIN_REF="origin/main"
      else
        MAIN_REF="origin/master"
      fi
      DEV_REF="origin/${CI_COMMIT_BRANCH}"

      RANGE="${MAIN_REF}..${DEV_REF}"
      COMPARE_URL="${CI_PROJECT_URL}/-/compare/${MAIN_REF#origin/}...${CI_COMMIT_BRANCH}"

      LIBERADO="$(git log --pretty='- %s (@%an)' "${RANGE}" | head -n 8)"
      if [ -z "${LIBERADO}" ]; then
        LIBERADO="- Sem novidades em relacao a ${MAIN_REF#origin/}."
      fi

      COMMITS_DESDE_MAIN="$(git log --pretty='- %h %s (@%an)' "${RANGE}" | head -n 20)"
      if [ -z "${COMMITS_DESDE_MAIN}" ]; then
        COMMITS_DESDE_MAIN="- Nenhum commit novo."
      fi

      CHANGED_PATHS="$(git diff --name-only "${MAIN_REF}...${DEV_REF}" | head -n 200)"
      TEST_ITEMS=""
      add_test_item() {
        item="$1"
        case "${TEST_ITEMS}" in
          *"$item"*) ;;
          *) TEST_ITEMS="${TEST_ITEMS}- ${item}\n" ;;
        esac
      }

      CHANGED_PATHS_FILE="$(mktemp)"
      printf '%s\n' "${CHANGED_PATHS}" > "${CHANGED_PATHS_FILE}"

      while IFS= read -r path; do
        case "${path}" in
          *nav*|*menu*|*route*|*Navigation*|*navigation*)
            add_test_item "Navegacao entre telas/menus (fluxo e foco)."
            ;;
          *ui/*|*screen*|*compose*|*layout*|*theme*|*res/*)
            add_test_item "Estados visuais e comportamento de foco/selecao na interface."
            ;;
          *repository*|*data/*|*network*|*retrofit*|*firebase*|*service*)
            add_test_item "Fluxo de dados e persistencia (carregar/salvar/sincronizar)."
            ;;
          *test/*|*Test.kt|*spec*)
            add_test_item "Executar cenarios de regressao cobertos pelos testes alterados."
            ;;
        esac
      done < "${CHANGED_PATHS_FILE}"
      rm -f "${CHANGED_PATHS_FILE}"

      if [ -z "${TEST_ITEMS}" ]; then
        TEST_ITEMS="- Fluxo principal da feature alterada.\n- Regressao basica: abrir, usar e retornar para a home.\n- Validar logs/erros em cenarios de borda."
      fi

      BRANCHES_ATRASADAS=""
      for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
        branch="${ref#origin/}"
        case "${branch}" in
          HEAD|main|master|dev|Dev) continue ;;
        esac

        behind="$(git rev-list --count "${ref}..${DEV_REF}" 2>/dev/null || echo 0)"
        if [ "${behind}" -gt 0 ]; then
          owner="$(git log -1 --pretty='%an' "${ref}" 2>/dev/null || echo 'desconhecido')"
          BRANCHES_ATRASADAS="${BRANCHES_ATRASADAS}- ${branch} (behind: ${behind}) - responsavel: @${owner}\n"
        fi
      done
      if [ -z "${BRANCHES_ATRASADAS}" ]; then
        BRANCHES_ATRASADAS="- Nenhuma branch atrasada em relacao a ${CI_COMMIT_BRANCH}."
      fi

      PAYLOAD="$(jq -n \
        --arg project "${CI_PROJECT_NAME}" \
        --arg branch "${CI_COMMIT_BRANCH}" \
        --arg short_sha "${SHORT_SHA}" \
        --arg liberado "${LIBERADO}" \
        --arg testar "${TEST_ITEMS}" \
        --arg commits "${COMMITS_DESDE_MAIN}" \
        --arg outdated "${BRANCHES_ATRASADAS}" \
        --arg compare_url "${COMPARE_URL}" \
        --arg pipeline_url "${CI_PIPELINE_URL}" \
        '{text: ("[DEV] Nova atualizacao disponivel\n"
          + "Projeto: " + $project + "\n"
          + "Branch: " + $branch + "\n"
          + "Commit: " + $short_sha + "\n\n"
          + "Liberado:\n" + $liberado + "\n\n"
          + "O que testar:\n" + $testar + "\n\n"
          + "Commits desde ultimo merge com main:\n" + $commits + "\n\n"
          + "Branches desatualizadas:\n" + $outdated + "\n"
          + "Comparacao: " + $compare_url + "\n"
          + "Pipeline: " + $pipeline_url + "\n\n"
          + "Liberada nova versao da Dev.")}')"

      curl --fail --show-error --silent -X POST -H "Content-Type: application/json; charset=UTF-8" -d "${PAYLOAD}" "${GOOGLE_CHAT_WEBHOOK_URL}"
