workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'

stages:
  - quality
  - test
  - build
  - deploy
  - notify

default:
  image: ghcr.io/cirruslabs/android-sdk:35
  cache:
    key: "gradle-${CI_PROJECT_ID}"
    paths:
      - .gradle/
      - .gradle-local/
  before_script:
    - chmod +x gradlew
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-local"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx2g'"

lint_debug:
  stage: quality
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
  script:
    - ./gradlew --no-daemon :app:lintDebug
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/reports/lint-results-debug.html
      - app/build/reports/lint-results-debug.xml

unit_tests:
  stage: test
  needs: ["lint_debug"]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
  script:
    - ./gradlew --no-daemon testDebugUnitTest
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/reports/tests/testDebugUnitTest/
      - app/build/test-results/testDebugUnitTest/

build_debug_apk:
  stage: build
  needs: ["unit_tests"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
  script:
    - ./gradlew --no-daemon :app:assembleDebug
  artifacts:
    expire_in: 7 days
    paths:
      - app/build/outputs/apk/debug/app-debug.apk

build_release_aab:
  stage: build
  needs: ["unit_tests"]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev")'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
      when: manual
  script:
    - ./gradlew --no-daemon :app:bundleRelease
  artifacts:
    expire_in: 14 days
    paths:
      - app/build/outputs/bundle/release/app-release.aab

deploy_release_play_console:
  stage: deploy
  image: ruby:3.3-alpine
  needs: ["build_release_aab"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev") && $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'
    - if: '$CI_COMMIT_TAG && $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master") && $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'
      when: manual
  variables:
    PLAY_TRACK: "${PLAY_TRACK:-internal}"
    PLAY_RELEASE_STATUS: "${PLAY_RELEASE_STATUS:-draft}"
  before_script:
    - apk add --no-cache bash curl git build-base ruby-dev
    - gem install fastlane --no-document
  script:
    - |
      if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
        echo "ERRO: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON nao definida."
        exit 1
      fi

      if [ -f "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
        PLAY_JSON_PATH="${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}"
      else
        PLAY_JSON_PATH="/tmp/google-play-service-account.json"
        printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" > "${PLAY_JSON_PATH}"
      fi

      fastlane supply \
        --aab "app/build/outputs/bundle/release/app-release.aab" \
        --json_key "${PLAY_JSON_PATH}" \
        --package_name "br.com.gui.carlembrete" \
        --track "${PLAY_TRACK:-internal}" \
        --release_status "${PLAY_RELEASE_STATUS:-draft}" \
        --skip_upload_images true \
        --skip_upload_screenshots true \
        --skip_upload_metadata true \
        --skip_upload_changelogs true

notify_google_chat:
  stage: notify
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev") && $GOOGLE_CHAT_WEBHOOK_URL'
  script:
    - apk add --no-cache git curl jq
    - |
      SHORT_SHA="$(printf '%s' "${CI_COMMIT_SHA}" | cut -c1-8)"
      TITLE="${CI_COMMIT_TITLE}"
      BODY="$(printf '%s' "${CI_COMMIT_MESSAGE}" | tail -n +2 | sed '/^[[:space:]]*$/d')"
      BEFORE_SHORT="$(printf '%s' "${CI_COMMIT_BEFORE_SHA}" | cut -c1-8)"
      PUSH_TIME_UTC="$(date -u +'%Y-%m-%d %H:%M UTC')"

      if [ -z "${BODY}" ]; then
        BODY="sem descricao no corpo do commit."
      fi

      if [ "${CI_COMMIT_BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
        COMMIT_COUNT="1"
        FILES="$(git show --pretty='' --name-only "${CI_COMMIT_SHA}" | head -n 20)"
        STATS_LINE="$(git show --shortstat --format='' "${CI_COMMIT_SHA}" | tail -n 1 | tr -s ' ')"
        COMMITS_LIST="$(git log -1 --pretty='- %h %s (%an)' "${CI_COMMIT_SHA}")"
        RANGE_LABEL="push inicial"
        COMPARE_URL="${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}"
      else
        COMMIT_COUNT="$(git rev-list --count "${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}")"
        FILES="$(git diff --name-only "${CI_COMMIT_BEFORE_SHA}" "${CI_COMMIT_SHA}" | head -n 20)"
        STATS_LINE="$(git diff --shortstat "${CI_COMMIT_BEFORE_SHA}" "${CI_COMMIT_SHA}" | tr -s ' ')"
        COMMITS_LIST="$(git log --pretty='- %h %s (%an)' "${CI_COMMIT_BEFORE_SHA}..${CI_COMMIT_SHA}" | head -n 8)"
        RANGE_LABEL="${BEFORE_SHORT}..${SHORT_SHA}"
        COMPARE_URL="${CI_PROJECT_URL}/-/compare/${CI_COMMIT_BEFORE_SHA}...${CI_COMMIT_SHA}"
      fi

      if [ -z "${FILES}" ]; then
        FILES="(sem diff detectado no pipeline)"
      fi
      if [ -z "${STATS_LINE}" ]; then
        STATS_LINE="sem estatisticas de diff"
      fi
      if [ -z "${COMMITS_LIST}" ]; then
        COMMITS_LIST="- ${SHORT_SHA} ${TITLE} (${GITLAB_USER_NAME})"
      fi

      CHANGED_FILES="$(printf '%s\n' "${FILES}" | sed 's/^/- /')"

      PAYLOAD="$(jq -n \
        --arg project "${CI_PROJECT_PATH}" \
        --arg branch "${CI_COMMIT_BRANCH}" \
        --arg author "${GITLAB_USER_NAME}" \
        --arg short_sha "${SHORT_SHA}" \
        --arg title "${TITLE}" \
        --arg body "${BODY}" \
        --arg commit_count "${COMMIT_COUNT}" \
        --arg range_label "${RANGE_LABEL}" \
        --arg stats_line "${STATS_LINE}" \
        --arg commits_list "${COMMITS_LIST}" \
        --arg push_time_utc "${PUSH_TIME_UTC}" \
        --arg files "${CHANGED_FILES}" \
        --arg commit_url "${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}" \
        --arg compare_url "${COMPARE_URL}" \
        --arg pipeline_url "${CI_PIPELINE_URL}" \
        '{text: ("Novo push em " + $project + "\n"
          + "Branch: " + $branch + "\n"
          + "Autor: " + $author + "\n"
          + "Horario (UTC): " + $push_time_utc + "\n"
          + "Range: " + $range_label + "\n"
          + "Commits no push: " + $commit_count + "\n"
          + "Diff: " + $stats_line + "\n\n"
          + "Ultimo commit (" + $short_sha + "): " + $title + "\n"
          + "Resumo do ultimo commit: " + $body + "\n\n"
          + "Commits incluidos (ate 8):\n"
          + $commits_list + "\n\n"
          + "Arquivos alterados (ate 20):\n"
          + $files + "\n"
          + "Commit: " + $commit_url + "\n"
          + "Comparacao: " + $compare_url + "\n"
          + "Pipeline: " + $pipeline_url)}')"

      curl --fail --show-error --silent -X POST -H "Content-Type: application/json; charset=UTF-8" -d "${PAYLOAD}" "${GOOGLE_CHAT_WEBHOOK_URL}"
