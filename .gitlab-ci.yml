workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - deploy
  - notify

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-local"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx2g'"
  PLAY_TRACK: "internal"
  PLAY_RELEASE_STATUS: "completed"
  PLAY_CHANGES_NOT_SENT_FOR_REVIEW: "true"

default:
  image: ghcr.io/cirruslabs/android-sdk:35
  cache:
    key: "gradle-${CI_PROJECT_ID}"
    paths:
      - .gradle/
      - .gradle-local/
  before_script:
    - chmod +x gradlew

unit_tests:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev")'
  script:
    - ./gradlew --no-daemon testDebugUnitTest
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/reports/tests/testDebugUnitTest/
      - app/build/test-results/testDebugUnitTest/

build_release_aab:
  stage: build
  needs: ["unit_tests"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev")'
    - if: '$CI_COMMIT_TAG'
  script:
    - ./gradlew --no-daemon :app:bundleRelease
    - test -f app/build/outputs/bundle/release/app-release.aab
  artifacts:
    expire_in: 14 days
    paths:
      - app/build/outputs/bundle/release/app-release.aab

notify_google_chat:
  stage: notify
  image: alpine:3.20
  needs: ["deploy_release_play_console"]
  dependencies: []
  rules:
    - if: '$GOOGLE_CHAT_WEBHOOK_URL && $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON && $PLAY_PACKAGE_NAME && $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev")'
  script:
    - apk add --no-cache git curl jq
    - |
      SHORT_SHA="$(printf '%s' "${CI_COMMIT_SHA}" | cut -c1-8)"
      git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*' || true

      if git show-ref --verify --quiet refs/remotes/origin/main; then
        MAIN_REF="origin/main"
      elif git show-ref --verify --quiet refs/remotes/origin/master; then
        MAIN_REF="origin/master"
      else
        MAIN_REF=""
      fi

      if [ -n "${MAIN_REF}" ]; then
        RANGE="${MAIN_REF}..origin/${CI_COMMIT_BRANCH}"
        COMMITS="$(git log --pretty='- %h %s (@%an)' "${RANGE}" 2>/dev/null | head -n 20)"
        COMPARE_URL="${CI_PROJECT_URL}/-/compare/${MAIN_REF#origin/}...${CI_COMMIT_BRANCH}"
      else
        COMMITS="$(git log --pretty='- %h %s (@%an)' -n 10 2>/dev/null)"
        COMPARE_URL="${CI_PROJECT_URL}/-/commits/${CI_COMMIT_BRANCH}"
      fi

      if [ -z "${COMMITS}" ]; then
        COMMITS="- Nao foi possivel coletar os commits automaticamente."
      fi

      PAYLOAD="$(jq -n \
        --arg project "${CI_PROJECT_NAME}" \
        --arg branch "${CI_COMMIT_BRANCH}" \
        --arg short_sha "${SHORT_SHA}" \
        --arg commits "${COMMITS}" \
        --arg compare_url "${COMPARE_URL}" \
        --arg pipeline_url "${CI_PIPELINE_URL}" \
        '{text: ("[DEV] Nova atualizacao disponivel\n"
          + "Projeto: " + $project + "\n"
          + "Branch: " + $branch + "\n"
          + "Commit: " + $short_sha + "\n\n"
          + "Commits desde main:\n" + $commits + "\n\n"
          + "Comparacao: " + $compare_url + "\n"
          + "Pipeline: " + $pipeline_url)}')"

      curl --fail --show-error --silent \
        -X POST \
        -H "Content-Type: application/json; charset=UTF-8" \
        -d "${PAYLOAD}" \
        "${GOOGLE_CHAT_WEBHOOK_URL}"

deploy_release_play_console:
  stage: deploy
  image: ruby:3.3-alpine
  needs: ["build_release_aab"]
  dependencies:
    - build_release_aab
  rules:
    - if: '$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON && $PLAY_PACKAGE_NAME && $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "Dev")'
    - if: '$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON && $PLAY_PACKAGE_NAME && $CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache bash curl git build-base ruby-dev
    - gem install fastlane --no-document
  script:
    - |
      if [ -z "${PLAY_PACKAGE_NAME}" ]; then
        echo "ERRO: PLAY_PACKAGE_NAME nao definido. Ex.: com.suaempresa.seuapp"
        exit 1
      fi

      if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
        echo "ERRO: AAB nao encontrado em app/build/outputs/bundle/release/app-release.aab"
        exit 1
      fi

      if [ -f "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
        PLAY_JSON_PATH="${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}"
      else
        PLAY_JSON_PATH="/tmp/google-play-service-account.json"
        printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" > "${PLAY_JSON_PATH}"
      fi

      fastlane supply \
        --aab "app/build/outputs/bundle/release/app-release.aab" \
        --json_key "${PLAY_JSON_PATH}" \
        --package_name "${PLAY_PACKAGE_NAME:-br.com.gui.carlembrete}" \
        --track "${PLAY_TRACK:-internal}" \
        --release_status "${PLAY_RELEASE_STATUS:-completed}" \
        --changes_not_sent_for_review "${PLAY_CHANGES_NOT_SENT_FOR_REVIEW:-true}" \
        --skip_upload_images true \
        --skip_upload_screenshots true \
        --skip_upload_metadata true \
        --skip_upload_changelogs true
