name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn

      - name: Add test summary
        if: always()
        run: |
          echo "## Android Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: \`${GITHUB_WORKFLOW}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch/Ref: \`${GITHUB_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Check e-mail config
        id: mail_config
        run: |
          if [ -n "${{ secrets.CI_SMTP_SERVER }}" ] && [ -n "${{ secrets.CI_SMTP_USERNAME }}" ] && [ -n "${{ secrets.CI_SMTP_PASSWORD }}" ] && [ -n "${{ secrets.CI_NOTIFY_TO }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send success e-mail
        if: success() && github.event_name == 'push' && steps.mail_config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.CI_SMTP_SERVER }}
          server_port: ${{ secrets.CI_SMTP_PORT || '587' }}
          secure: false
          username: ${{ secrets.CI_SMTP_USERNAME }}
          password: ${{ secrets.CI_SMTP_PASSWORD }}
          subject: "[CI OK] Projeto_GOL - ${{ github.ref_name }}"
          to: ${{ secrets.CI_NOTIFY_TO }}
          from: ${{ secrets.CI_NOTIFY_FROM || secrets.CI_SMTP_USERNAME }}
          body: |
            CI finalizada com sucesso.
            Repositorio: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor do commit: ${{ github.actor }}
            Workflow: ${{ github.workflow }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

