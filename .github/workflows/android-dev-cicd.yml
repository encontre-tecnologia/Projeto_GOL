name: Android Dev CI/CD

on:
  push:
    branches: ["dev", "Dev"]
  workflow_dispatch:

concurrency:
  group: android-dev-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn

  deploy_play:
    name: Deploy Google Play Internal
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "ERRO: segredo GOOGLE_PLAY_SERVICE_ACCOUNT_JSON nao configurado no GitHub."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_STORE_FILE_BASE64 }}" ] || [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ] || [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] || [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "ERRO: faltam secrets de assinatura RELEASE_* no GitHub."
            exit 1
          fi

      - name: Configure signing keystore
        env:
          RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "${RELEASE_STORE_FILE_BASE64}" | base64 --decode > keystore/upload.jks

          echo "RELEASE_STORE_FILE=${GITHUB_WORKSPACE}/keystore/upload.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        run: |
          VERSION_CODE=$(date +%Y%m%d%H)
          echo "Using VERSION_CODE=${VERSION_CODE}"
          VERSION_CODE=${VERSION_CODE} ./gradlew --no-daemon :app:bundleRelease

      - name: Verify AAB signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play (internal)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Accept raw JSON or base64-encoded JSON in the same secret.
          if echo "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" | jq -e . >/dev/null 2>&1; then
            printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" > /tmp/google-play-service-account.json
          else
            printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" | base64 --decode > /tmp/google-play-service-account.json
          fi

          # Validate service account key structure before calling fastlane.
          jq -e '.type == "service_account" and (.client_email|type=="string") and (.private_key|type=="string")' \
            /tmp/google-play-service-account.json >/dev/null || {
            echo "ERRO: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON invalido. Use o JSON de chave de conta de servico (type=service_account)."
            exit 1
          }

          fastlane supply \
            --aab "app/build/outputs/bundle/release/app-release.aab" \
            --json_key "/tmp/google-play-service-account.json" \
            --package_name "br.com.gui.carlembrete" \
            --track "internal" \
            --release_status "completed" \
            --changes_not_sent_for_review true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_metadata true \
            --skip_upload_changelogs true

  notify_chat:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [deploy_play]

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate webhook secret
        run: |
          if [ -z "${{ secrets.NOTIFICATION_WEBHOOK_URL }}" ]; then
            echo "ERRO: segredo NOTIFICATION_WEBHOOK_URL nao configurado no GitHub."
            exit 1
          fi

      - name: Send rich message to Discord
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
          PLAY_CONSOLE_INTERNAL_URL: ${{ secrets.PLAY_CONSOLE_INTERNAL_URL }}
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${GITHUB_REF_NAME}"
          PLAY_URL="${PLAY_CONSOLE_INTERNAL_URL:-https://play.google.com/console}"
          INTERNAL_TEST_URL="https://play.google.com/apps/internaltest/4701271977749957174"

          git fetch origin main --quiet || true
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet || true

          FEATURES="$(git log --pretty='- %s (@%an)' origin/main..HEAD | head -n 12)"
          if [ -z "${FEATURES}" ]; then
            FEATURES="- Sem commits novos em relacao a main."
          fi

          CHANGED_FILES="$(git diff --name-only origin/main...HEAD | head -n 200)"
          CHANGED_FILES_FILE="$(mktemp)"
          printf '%s\n' "${CHANGED_FILES}" > "${CHANGED_FILES_FILE}"

          TEST_ITEMS=""
          add_test_item() {
            item="$1"
            case "${TEST_ITEMS}" in
              *"$item"*) ;;
              *) TEST_ITEMS="${TEST_ITEMS}- ${item}\n" ;;
            esac
          }

          while IFS= read -r path; do
            case "${path}" in
              *nav*|*menu*|*route*|*Navigation*|*navigation*)
                add_test_item "Navegacao entre telas e fluxo de foco."
                ;;
              *ui/*|*screen*|*compose*|*layout*|*theme*|*res/*)
                add_test_item "Layout, estados visuais e componentes alterados."
                ;;
              *data/*|*repository*|*network*|*service*|*firebase*)
                add_test_item "Persistencia e sincronizacao de dados."
                ;;
            esac
          done < "${CHANGED_FILES_FILE}"
          rm -f "${CHANGED_FILES_FILE}"

          if [ -z "${TEST_ITEMS}" ]; then
            TEST_ITEMS="- Fluxo principal da feature alterada.\n- Regressao basica de navegacao e dados."
          fi

          DEV_REMOTE="origin/${GITHUB_REF_NAME}"
          BRANCHES_ATRASADAS=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            branch="${ref#origin/}"
            case "${branch}" in
              HEAD|main|master|dev|Dev) continue ;;
            esac

            behind="$(git rev-list --count "${ref}..${DEV_REMOTE}" 2>/dev/null || echo 0)"
            if [ "${behind}" -gt 0 ]; then
              owner="$(git log --reverse --pretty='%an' "${ref}" 2>/dev/null | head -n 1)"
              if [ -z "${owner}" ]; then
                owner="desconhecido"
              fi
              BRANCHES_ATRASADAS="${BRANCHES_ATRASADAS}- ${branch} (behind: ${behind}) - criador: ${owner}\n"
            fi
          done

          if [ -z "${BRANCHES_ATRASADAS}" ]; then
            BRANCHES_ATRASADAS="- Nenhuma branch desatualizada em relacao a ${GITHUB_REF_NAME}."
          fi

          PAYLOAD="$(jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg sha "${SHORT_SHA}" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg features "${FEATURES}" \
            --arg tests "${TEST_ITEMS}" \
            --arg outdated "${BRANCHES_ATRASADAS}" \
            --arg internal_test_url "${INTERNAL_TEST_URL}" \
            --arg play_url "${PLAY_URL}" \
            --arg compare_url "${COMPARE_URL}" \
            --arg run_url "${RUN_URL}" \
            '{content: ("[DEV] Nova versao publicada no Google Play (Interno)\n"
              + "Projeto: " + $repo + "\n"
              + "Branch: " + $branch + "\n"
              + "Commit: " + $sha + " (@"+$actor+")\n\n"
              + "O que foi implementado (desde a main):\n" + $features + "\n\n"
              + "O que validar agora:\n" + $tests + "\n\n"
              + "Branches desatualizadas em relacao a Dev:\n" + $outdated + "\n"
              + "Para realizar as validacoes, por favor realize o merge das branches com a Dev.\n\n"
              + "Link para testar em teste interno: " + $internal_test_url + "\n"
              + "Play Console: " + $play_url + "\n"
              + "Compare: " + $compare_url + "\n"
              + "Pipeline: " + $run_url + "\n")}')"

          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "${PAYLOAD}" \
            "${NOTIFICATION_WEBHOOK_URL}"
